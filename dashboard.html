<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFQ Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .dashboard-header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .dashboard-header p {
            color: #a0a0a0;
            margin-top: 10px;
        }
        .kpi-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .kpi-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px 40px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }
        .kpi-card:hover {
            transform: translateY(-5px);
        }
        .kpi-value {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .kpi-label {
            color: #a0a0a0;
            margin-top: 5px;
            font-size: 0.9rem;
        }
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 25px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .chart-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        .chart-card h3 {
            margin-bottom: 20px;
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chart-card h3::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #00d4ff, #7b2cbf);
            border-radius: 2px;
        }
        .chart-wrapper {
            position: relative;
            height: 350px;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
            .kpi-container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <h1>📊 RFQ Dashboard</h1>
        <p>Request for Quotations - Übersicht und Analyse</p>
    </div>

    <div class="kpi-container">
        <div class="kpi-card">
            <div class="kpi-value">37.348</div>
            <div class="kpi-label">Gesamt RFQs</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-value">30.233</div>
            <div class="kpi-label">Abgeschlossen</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-value">443</div>
            <div class="kpi-label">Laufend</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-value">81%</div>
            <div class="kpi-label">Abschlussrate</div>
        </div>
    </div>

    <div class="charts-container">
        <div class="chart-card">
            <h3>RFQs nach Status</h3>
            <div class="chart-wrapper">
                <canvas id="statusChart"></canvas>
            </div>
        </div>

        <div class="chart-card">
            <h3>RFQs nach Einkaufsorganisation</h3>
            <div class="chart-wrapper">
                <canvas id="orgChart"></canvas>
            </div>
        </div>

        <div class="chart-card full-width">
            <h3>RFQs pro Monat (letzte 12 Monate)</h3>
            <div class="chart-wrapper">
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Farbpalette
        const colors = {
            primary: 'rgba(0, 212, 255, 0.8)',
            secondary: 'rgba(123, 44, 191, 0.8)',
            success: 'rgba(46, 213, 115, 0.8)',
            warning: 'rgba(255, 193, 7, 0.8)',
            danger: 'rgba(255, 71, 87, 0.8)',
            info: 'rgba(70, 130, 180, 0.8)',
            gradient: ['rgba(0, 212, 255, 0.8)', 'rgba(123, 44, 191, 0.8)', 'rgba(46, 213, 115, 0.8)', 'rgba(255, 193, 7, 0.8)', 'rgba(255, 71, 87, 0.8)', 'rgba(70, 130, 180, 0.8)']
        };

        // Status Chart
        const statusCtx = document.getElementById('statusChart').getContext('2d');
        new Chart(statusCtx, {
            type: 'bar',
            data: {
                labels: ['Abgeschlossen', 'In Prüfung', 'Abgebrochen', 'Geplant', 'Laufend', 'Genehmigt'],
                datasets: [{
                    label: 'Anzahl RFQs',
                    data: [30233, 3097, 2987, 560, 443, 28],
                    backgroundColor: [
                        colors.success,
                        colors.primary,
                        colors.danger,
                        colors.warning,
                        colors.secondary,
                        colors.info
                    ],
                    borderColor: [
                        'rgba(46, 213, 115, 1)',
                        'rgba(0, 212, 255, 1)',
                        'rgba(255, 71, 87, 1)',
                        'rgba(255, 193, 7, 1)',
                        'rgba(123, 44, 191, 1)',
                        'rgba(70, 130, 180, 1)'
                    ],
                    borderWidth: 2,
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(255,255,255,0.1)'
                        },
                        ticks: {
                            color: '#a0a0a0'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            color: '#a0a0a0'
                        }
                    }
                }
            }
        });

        // Organization Chart
        const orgCtx = document.getElementById('orgChart').getContext('2d');
        new Chart(orgCtx, {
            type: 'bar',
            data: {
                labels: ['EMtec', 'Mining', 'Components', 'MCCtec', 'Biberach', 'Verzahntechnik', 'Mischtechnik', 'International', 'Ehingen', 'Aerospace'],
                datasets: [{
                    label: 'Anzahl RFQs',
                    data: [13176, 8494, 8490, 1863, 1653, 1601, 764, 689, 408, 123],
                    backgroundColor: function(context) {
                        const chart = context.chart;
                        const {ctx, chartArea} = chart;
                        if (!chartArea) return colors.primary;
                        const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
                        gradient.addColorStop(0, 'rgba(0, 212, 255, 0.6)');
                        gradient.addColorStop(1, 'rgba(123, 44, 191, 0.8)');
                        return gradient;
                    },
                    borderColor: 'rgba(0, 212, 255, 1)',
                    borderWidth: 1,
                    borderRadius: 8
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(255,255,255,0.1)'
                        },
                        ticks: {
                            color: '#a0a0a0'
                        }
                    },
                    y: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            color: '#a0a0a0'
                        }
                    }
                }
            }
        });

        // Monthly Chart
        const monthlyCtx = document.getElementById('monthlyChart').getContext('2d');
        new Chart(monthlyCtx, {
            type: 'bar',
            data: {
                labels: ['Mai 23', 'Jun 23', 'Jul 23', 'Aug 23', 'Sep 23', 'Okt 23', 'Nov 23', 'Dez 23', 'Jan 24', 'Feb 24', 'Mär 24', 'Apr 24'],
                datasets: [{
                    label: 'Anzahl RFQs',
                    data: [1027, 1030, 1072, 694, 947, 962, 1014, 747, 958, 1068, 1050, 188],
                    backgroundColor: function(context) {
                        const chart = context.chart;
                        const {ctx, chartArea} = chart;
                        if (!chartArea) return colors.primary;
                        const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
                        gradient.addColorStop(0, 'rgba(0, 212, 255, 0.4)');
                        gradient.addColorStop(1, 'rgba(0, 212, 255, 0.9)');
                        return gradient;
                    },
                    borderColor: 'rgba(0, 212, 255, 1)',
                    borderWidth: 2,
                    borderRadius: 10
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(255,255,255,0.1)'
                        },
                        ticks: {
                            color: '#a0a0a0'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            color: '#a0a0a0'
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
