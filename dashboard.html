<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFQ Status Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: #a0aec0;
            font-size: 1.1rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .stat-card .label {
            color: #a0aec0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-card.done .number { color: #10b981; }
        .stat-card.checking .number { color: #f59e0b; }
        .stat-card.canceled .number { color: #ef4444; }
        .stat-card.planned .number { color: #3b82f6; }
        .stat-card.running .number { color: #8b5cf6; }
        .stat-card.approved .number { color: #06b6d4; }
        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chart-title {
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }
        .chart-wrapper {
            position: relative;
            height: 400px;
        }
        .total-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #7c3aed, #00d4ff);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>📊 RFQ Status Dashboard</h1>
            <p>Übersicht aller Request for Quotations nach Status</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card done">
                <div class="number">30.233</div>
                <div class="label">Done</div>
            </div>
            <div class="stat-card checking">
                <div class="number">3.097</div>
                <div class="label">Checking</div>
            </div>
            <div class="stat-card canceled">
                <div class="number">2.987</div>
                <div class="label">Canceled</div>
            </div>
            <div class="stat-card planned">
                <div class="number">560</div>
                <div class="label">Planned</div>
            </div>
            <div class="stat-card running">
                <div class="number">443</div>
                <div class="label">Running</div>
            </div>
            <div class="stat-card approved">
                <div class="number">28</div>
                <div class="label">Approved</div>
            </div>
        </div>
        
        <div class="chart-container">
            <div class="total-badge">Gesamt: 37.348 RFQs</div>
            <h2 class="chart-title">📈 RFQs nach Status</h2>
            <div class="chart-wrapper">
                <canvas id="rfqChart"></canvas>
            </div>
        </div>
    </div>
    
    <script>
        const ctx = document.getElementById('rfqChart').getContext('2d');
        
        const gradient1 = ctx.createLinearGradient(0, 0, 0, 400);
        gradient1.addColorStop(0, 'rgba(16, 185, 129, 0.8)');
        gradient1.addColorStop(1, 'rgba(16, 185, 129, 0.2)');
        
        const gradient2 = ctx.createLinearGradient(0, 0, 0, 400);
        gradient2.addColorStop(0, 'rgba(245, 158, 11, 0.8)');
        gradient2.addColorStop(1, 'rgba(245, 158, 11, 0.2)');
        
        const gradient3 = ctx.createLinearGradient(0, 0, 0, 400);
        gradient3.addColorStop(0, 'rgba(239, 68, 68, 0.8)');
        gradient3.addColorStop(1, 'rgba(239, 68, 68, 0.2)');
        
        const gradient4 = ctx.createLinearGradient(0, 0, 0, 400);
        gradient4.addColorStop(0, 'rgba(59, 130, 246, 0.8)');
        gradient4.addColorStop(1, 'rgba(59, 130, 246, 0.2)');
        
        const gradient5 = ctx.createLinearGradient(0, 0, 0, 400);
        gradient5.addColorStop(0, 'rgba(139, 92, 246, 0.8)');
        gradient5.addColorStop(1, 'rgba(139, 92, 246, 0.2)');
        
        const gradient6 = ctx.createLinearGradient(0, 0, 0, 400);
        gradient6.addColorStop(0, 'rgba(6, 182, 212, 0.8)');
        gradient6.addColorStop(1, 'rgba(6, 182, 212, 0.2)');
        
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Done', 'Checking', 'Canceled', 'Planned', 'Running', 'Approved'],
                datasets: [{
                    label: 'Anzahl RFQs',
                    data: [30233, 3097, 2987, 560, 443, 28],
                    backgroundColor: [gradient1, gradient2, gradient3, gradient4, gradient5, gradient6],
                    borderColor: ['#10b981', '#f59e0b', '#ef4444', '#3b82f6', '#8b5cf6', '#06b6d4'],
                    borderWidth: 2,
                    borderRadius: 8,
                    borderSkipped: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        titleColor: '#fff',
                        bodyColor: '#fff',
                        padding: 15,
                        cornerRadius: 10,
                        displayColors: false,
                        callbacks: {
                            label: function(context) {
                                return context.parsed.y.toLocaleString('de-DE') + ' RFQs';
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)',
                            drawBorder: false
                        },
                        ticks: {
                            color: '#a0aec0',
                            font: { size: 12 },
                            callback: function(value) {
                                return value.toLocaleString('de-DE');
                            }
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            color: '#a0aec0',
                            font: { size: 13, weight: '500' }
                        }
                    }
                },
                animation: {
                    duration: 1500,
                    easing: 'easeOutQuart'
                }
            }
        });
    </script>
</body>
</html>
