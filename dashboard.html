<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFQ Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .dashboard-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .dashboard-header p {
            color: #a0a0a0;
            font-size: 1.1rem;
        }
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .kpi-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.3s ease;
        }
        .kpi-card:hover {
            transform: translateY(-5px);
        }
        .kpi-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .kpi-label {
            color: #a0a0a0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .kpi-card:nth-child(1) .kpi-value { color: #00d4ff; }
        .kpi-card:nth-child(2) .kpi-value { color: #4ade80; }
        .kpi-card:nth-child(3) .kpi-value { color: #fbbf24; }
        .kpi-card:nth-child(4) .kpi-value { color: #f472b6; }
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
        }
        .chart-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .chart-card h3 {
            margin-bottom: 20px;
            color: #fff;
            font-size: 1.3rem;
            text-align: center;
        }
        .chart-wrapper {
            position: relative;
            height: 350px;
        }
        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
            .dashboard-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <h1>📊 RFQ Dashboard</h1>
        <p>Request for Quotation - Übersicht und Analysen</p>
    </div>
    
    <div class="kpi-container">
        <div class="kpi-card">
            <div class="kpi-value">37.348</div>
            <div class="kpi-label">Gesamt RFQs</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-value">30.233</div>
            <div class="kpi-label">Abgeschlossen</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-value">3.097</div>
            <div class="kpi-label">In Prüfung</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-value">443</div>
            <div class="kpi-label">Laufend</div>
        </div>
    </div>
    
    <div class="charts-container">
        <div class="chart-card">
            <h3>📈 RFQs nach Status</h3>
            <div class="chart-wrapper">
                <canvas id="statusChart"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <h3>📅 RFQs pro Monat (letzte 12 Monate)</h3>
            <div class="chart-wrapper">
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>
    </div>
    
    <script>
        const statusData = {
            labels: ['Abgeschlossen', 'In Prüfung', 'Abgebrochen', 'Geplant', 'Laufend', 'Genehmigt'],
            datasets: [{
                label: 'Anzahl RFQs',
                data: [30233, 3097, 2987, 560, 443, 28],
                backgroundColor: [
                    'rgba(74, 222, 128, 0.8)',
                    'rgba(251, 191, 36, 0.8)',
                    'rgba(248, 113, 113, 0.8)',
                    'rgba(96, 165, 250, 0.8)',
                    'rgba(167, 139, 250, 0.8)',
                    'rgba(244, 114, 182, 0.8)'
                ],
                borderColor: [
                    'rgba(74, 222, 128, 1)',
                    'rgba(251, 191, 36, 1)',
                    'rgba(248, 113, 113, 1)',
                    'rgba(96, 165, 250, 1)',
                    'rgba(167, 139, 250, 1)',
                    'rgba(244, 114, 182, 1)'
                ],
                borderWidth: 2,
                borderRadius: 8
            }]
        };
        
        const monthlyData = {
            labels: ['Mai 23', 'Jun 23', 'Jul 23', 'Aug 23', 'Sep 23', 'Okt 23', 'Nov 23', 'Dez 23', 'Jan 24', 'Feb 24', 'Mär 24', 'Apr 24'],
            datasets: [{
                label: 'Anzahl RFQs',
                data: [1027, 1030, 1072, 694, 947, 962, 1014, 747, 958, 1068, 1050, 188],
                backgroundColor: 'rgba(0, 212, 255, 0.7)',
                borderColor: 'rgba(0, 212, 255, 1)',
                borderWidth: 2,
                borderRadius: 8
            }]
        };
        
        const chartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    backgroundColor: 'rgba(0,0,0,0.8)',
                    padding: 12,
                    titleFont: { size: 14 },
                    bodyFont: { size: 13 }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: {
                        color: 'rgba(255,255,255,0.1)'
                    },
                    ticks: {
                        color: '#a0a0a0',
                        font: { size: 12 }
                    }
                },
                x: {
                    grid: {
                        display: false
                    },
                    ticks: {
                        color: '#a0a0a0',
                        font: { size: 11 }
                    }
                }
            }
        };
        
        new Chart(document.getElementById('statusChart'), {
            type: 'bar',
            data: statusData,
            options: chartOptions
        });
        
        new Chart(document.getElementById('monthlyChart'), {
            type: 'bar',
            data: monthlyData,
            options: chartOptions
        });
    </script>
</body>
</html>
