<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFQs pro Jahr - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 30px;
        }
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header p {
            color: #a0aec0;
            font-size: 1.1rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .stat-card .year {
            color: #a0aec0;
            font-size: 1rem;
            margin-bottom: 8px;
        }
        .stat-card .value {
            color: #fff;
            font-size: 2rem;
            font-weight: 700;
        }
        .stat-card.total {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .stat-card.total .year {
            color: rgba(255,255,255,0.8);
        }
        .chart-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .chart-title {
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 25px;
            font-weight: 500;
        }
        .chart-wrapper {
            position: relative;
            height: 400px;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #718096;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>📊 RFQs pro Jahr</h1>
            <p>Übersicht der Request for Quotations (2020-2024)</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="year">2020</div>
                <div class="value">2.340</div>
            </div>
            <div class="stat-card">
                <div class="year">2021</div>
                <div class="value">9.820</div>
            </div>
            <div class="stat-card">
                <div class="year">2022</div>
                <div class="value">10.979</div>
            </div>
            <div class="stat-card">
                <div class="year">2023</div>
                <div class="value">10.945</div>
            </div>
            <div class="stat-card">
                <div class="year">2024</div>
                <div class="value">3.264</div>
            </div>
            <div class="stat-card total">
                <div class="year">Gesamt</div>
                <div class="value">37.348</div>
            </div>
        </div>
        
        <div class="chart-container">
            <h3 class="chart-title">📈 Anzahl RFQs nach Jahr</h3>
            <div class="chart-wrapper">
                <canvas id="rfqChart"></canvas>
            </div>
        </div>
        
        <div class="footer">
            <p>Dashboard erstellt am: <span id="currentDate"></span></p>
        </div>
    </div>
    
    <script>
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('de-DE', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
        
        const ctx = document.getElementById('rfqChart').getContext('2d');
        
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(102, 126, 234, 0.8)');
        gradient.addColorStop(1, 'rgba(118, 75, 162, 0.8)');
        
        const hoverGradient = ctx.createLinearGradient(0, 0, 0, 400);
        hoverGradient.addColorStop(0, 'rgba(102, 126, 234, 1)');
        hoverGradient.addColorStop(1, 'rgba(118, 75, 162, 1)');
        
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['2020', '2021', '2022', '2023', '2024'],
                datasets: [{
                    label: 'Anzahl RFQs',
                    data: [2340, 9820, 10979, 10945, 3264],
                    backgroundColor: gradient,
                    hoverBackgroundColor: hoverGradient,
                    borderRadius: 8,
                    borderSkipped: false,
                    barThickness: 60
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.8)',
                        titleFont: {
                            size: 14,
                            weight: 'bold'
                        },
                        bodyFont: {
                            size: 13
                        },
                        padding: 12,
                        cornerRadius: 8,
                        displayColors: false,
                        callbacks: {
                            label: function(context) {
                                return 'RFQs: ' + context.parsed.y.toLocaleString('de-DE');
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            color: '#a0aec0',
                            font: {
                                size: 14,
                                weight: '500'
                            }
                        }
                    },
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(255,255,255,0.1)'
                        },
                        ticks: {
                            color: '#a0aec0',
                            font: {
                                size: 12
                            },
                            callback: function(value) {
                                return value.toLocaleString('de-DE');
                            }
                        }
                    }
                },
                animation: {
                    duration: 1500,
                    easing: 'easeOutQuart'
                }
            }
        });
    </script>
</body>
</html>
